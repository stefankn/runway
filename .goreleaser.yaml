# GoReleaser configuration (https://goreleaser.com). A pushed v* tag runs this
# in .github/workflows/release.yml; `just release-check` does a local dry run.
version: 2
project_name: runway

builds:
  - main: ./cmd/runway
    binary: runway
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64] # Xcode 27 only runs on Apple silicon
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# Signs the binary with the Developer ID certificate and notarizes it with
# Apple, so Gatekeeper accepts it. Runs in the release workflow only: without
# the secrets (e.g. `just release-check`), it is skipped.
notarize:
  macos:
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

# Updates Casks/runway.rb in github.com/stefankn/homebrew-tap, so that
# `brew install stefankn/tap/runway` installs the release.
homebrew_casks:
  - name: runway
    repository:
      owner: stefankn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/stefankn/runway
    description: Build, run and stream logs for Xcode apps from the terminal
    license: MIT
    binaries: [runway]
    generate_completions_from_executable:
      executable: runway
      args: [completion]
      shells: [bash, zsh, fish]
    # No depends_on here: GoReleaser adds `depends_on :macos` and
    # `depends_on arch: :arm64` itself, and Homebrew refuses a versioned
    # `depends_on macos:` next to the former. Xcode 27 needs Tahoe anyway.
    # No quarantine workaround: the binary is notarized (see notarize above),
    # so Gatekeeper accepts the quarantined download, also when
    # generate_completions_from_executable runs it during the install.
    caveats: "runway needs Xcode 27.2 or later."
