# GoReleaser configuration (https://goreleaser.com). A pushed v* tag runs this
# in .github/workflows/release.yml; `just release-check` does a local dry run.
version: 2
project_name: runway

builds:
  - main: ./cmd/runway
    binary: runway
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64] # Xcode 27 only runs on Apple silicon
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

# Updates Casks/runway.rb in github.com/stefankn/homebrew-tap, so that
# `brew install stefankn/tap/runway` installs the release.
homebrew_casks:
  - name: runway
    repository:
      owner: stefankn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/stefankn/runway
    description: Build, run and stream logs for Xcode apps from the terminal
    license: MIT
    binaries: [runway]
    generate_completions_from_executable:
      executable: runway
      args: [completion]
      shells: [bash, zsh, fish]
    # No depends_on here: GoReleaser adds `depends_on :macos` and
    # `depends_on arch: :arm64` itself, and Homebrew refuses a versioned
    # `depends_on macos:` next to the former. Xcode 27 needs Tahoe anyway.
    caveats: "runway needs Xcode 27.2 or later."
    # The binary isn't notarized, and Homebrew quarantines cask downloads.
    # GoReleaser's hooks.post would write a `postflight` block, which Homebrew
    # 7 deprecates in favour of the declarative `postflight_steps`.
    # {{staged_path}} is Homebrew's token; it is written as a Go template
    # string so that GoReleaser leaves it alone.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/runway"]
      end
