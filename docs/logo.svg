<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="runway logo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1326"/>
      <stop offset="0.5" stop-color="#1a2747"/>
      <stop offset="1" stop-color="#2a2340"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="122" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tarmac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3346"/>
      <stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#ffc371"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <circle cx="128" cy="122" r="96" fill="url(#glow)"/>
    <rect x="0" y="121" width="256" height="1.5" fill="#ffb47a" opacity="0.35"/>

    <!-- runway -->
    <polygon points="40,256 216,256 140,122 116,122" fill="url(#tarmac)"/>
    <polygon points="40,256 54,256 118,122 116,122" fill="#e8ecf5"/>
    <polygon points="216,256 202,256 138,122 140,122" fill="#e8ecf5"/>

    <!-- centre line -->
    <g fill="#ffd27a">
      <polygon points="124,256 132,256 131.4,234 124.6,234"/>
      <polygon points="125.1,214 130.9,214 130.4,196 125.6,196"/>
      <polygon points="125.9,180 130.1,180 129.8,167 126.2,167"/>
      <polygon points="126.5,156 129.5,156 129.3,146 126.7,146"/>
      <polygon points="127,138 129,138 128.9,131 127.1,131"/>
    </g>

    <!-- edge lights -->
    <g fill="#ffd27a">
      <circle cx="35" cy="240" r="4"/>
      <circle cx="221" cy="240" r="4"/>
      <circle cx="62" cy="196" r="3.2"/>
      <circle cx="194" cy="196" r="3.2"/>
      <circle cx="82" cy="164" r="2.5"/>
      <circle cx="174" cy="164" r="2.5"/>
      <circle cx="97" cy="141" r="1.9"/>
      <circle cx="159" cy="141" r="1.9"/>
    </g>
  </g>

  <!-- play button taking off -->
  <g transform="translate(146 66) rotate(-16) scale(0.9)">
    <g stroke="#ffc371" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <line x1="-66" y1="-12" x2="-40" y2="-12"/>
      <line x1="-80" y1="4" x2="-40" y2="4"/>
      <line x1="-60" y1="20" x2="-40" y2="20"/>
    </g>
    <path d="M -30 -30 Q -30 -38 -22 -34 L 34 -4 Q 40 0 34 4 L -22 34 Q -30 38 -30 30 Z" fill="url(#play)"/>
  </g>
</svg>
